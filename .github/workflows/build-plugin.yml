name: Build KMZ ODN Export Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q odn_export
      - name: Run pure naming tests
        run: python -m unittest discover -s tests -v
      - name: Package QGIS plugin
        run: |
          mkdir -p dist
          zip -r dist/odn_export_kmz.zip odn_export -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: odn-export-kmz-qgis-plugin
          path: dist/odn_export_kmz.zip
